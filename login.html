<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Connexion — Chat IA</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --border: #262b33;
    --text: #e6e8eb;
    --dim: #7d8590;
    --accent: #5fd3a3;
    --danger: #e5666b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; font-weight: 600; }

  .tabs { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tabs button {
    flex: 1;
    background: var(--panel);
    color: var(--dim);
    border: none;
    padding: 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .tabs button.active { background: var(--accent); color: #0d0f12; }

  form { display: flex; flex-direction: column; gap: 10px; }
  input {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 13px 14px;
    font-family: inherit;
    font-size: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .primary-btn {
    background: var(--accent);
    color: #0d0f12;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.5; }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 11px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .oauth-list { display: flex; flex-direction: column; gap: 8px; }
  .oauth-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  .oauth-btn:active { transform: scale(0.98); }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .msg { font-size: 12.5px; text-align: center; min-height: 16px; line-height: 1.4; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--accent); }
</style>
</head>
<body>

  <div class="card">
    <div class="brand"><span class="dot"></span><h1>chat</h1></div>

    <div class="tabs">
      <button id="tab-signin" class="active" type="button">Connexion</button>
      <button id="tab-signup" type="button">Créer un compte</button>
    </div>

    <form id="auth-form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required minlength="6">
      <button class="primary-btn" id="submit-btn" type="submit">Se connecter</button>
    </form>

    <p class="msg" id="msg"></p>

    <div class="divider">ou</div>

    <div class="oauth-list">
      <button class="oauth-btn" data-provider="google" type="button">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.28-1.68 3.76-5.5 3.76-3.3 0-6-2.73-6-6.1s2.7-6.1 6-6.1c1.88 0 3.14.8 3.86 1.49l2.63-2.53C16.9 3 14.66 2 12 2 6.9 2 2.8 6.14 2.8 11.24S6.9 20.5 12 20.5c6.6 0 8.72-4.6 8.72-6.98 0-.47-.05-.83-.11-1.19L12 10.2z"/></svg>
        Continuer avec Google
      </button>
      <button class="oauth-btn" data-provider="discord" type="button">
        <svg viewBox="0 0 24 24"><path fill="#5865F2" d="M20.3 5.4a17 17 0 0 0-4.3-1.3l-.2.4a15 15 0 0 1 3.8 1.4c-1.6-.8-3.2-1.3-4.9-1.5a12 12 0 0 0-5.4 0c-1.7.2-3.3.7-4.9 1.5a15 15 0 0 1 3.8-1.4l-.2-.4A17 17 0 0 0 3.7 5.4C1.5 8.7.9 12 1.2 15.1a17 17 0 0 0 5.1 2.6l.6-1c-.7-.3-1.4-.6-2-1 .2-.1.4-.3.5-.4a12 12 0 0 0 10.2 0l.5.4c-.6.4-1.3.7-2 1l.6 1a17 17 0 0 0 5.1-2.6c.4-3.6-.4-6.9-1.5-9.7ZM9 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm5.9 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg>
        Continuer avec Discord
      </button>
      <button class="oauth-btn" data-provider="github" type="button">
        <svg viewBox="0 0 24 24"><path fill="#e6e8eb" d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 22 12c0-5.5-4.5-10-10-10Z"/></svg>
        Continuer avec GitHub
      </button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const submitBtn = document.getElementById('submit-btn');
  const authForm = document.getElementById('auth-form');
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const msgEl = document.getElementById('msg');

  let mode = 'signin'; // 'signin' | 'signup'

  // Si déjà connecté, direct vers le chat.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'index.html';
  });

  function setMode(newMode) {
    mode = newMode;
    tabSignin.classList.toggle('active', mode === 'signin');
    tabSignup.classList.toggle('active', mode === 'signup');
    submitBtn.textContent = mode === 'signin' ? 'Se connecter' : 'Créer mon compte';
    passwordEl.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
    msgEl.textContent = '';
    msgEl.className = 'msg';
  }

  tabSignin.addEventListener('click', () => setMode('signin'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = `msg ${type}`;
  }

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    submitBtn.disabled = true;
    showMsg('', '');

    try {
      if (mode === 'signup') {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        showMsg('Compte créé. Vérifie tes emails si une confirmation est requise, sinon tu es connecté(e).', 'success');
        // Si la confirmation email est désactivée, une session existe déjà :
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) window.location.href = 'index.html';
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'index.html';
      }
    } catch (err) {
      showMsg(err.message || 'Une erreur est survenue.', 'error');
    }

    submitBtn.disabled = false;
  });

  document.querySelectorAll('.oauth-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const provider = btn.dataset.provider;
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider,
        options: { redirectTo: window.location.origin + '/index.html' },
      });
      if (error) showMsg(error.message, 'error');
    });
  });
</script>
</body>
</html>
