<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131a28">
<title>Connexion — kiritoAI</title>
<style>
  :root {
    --bg: #131a28;
    --bg-glow: #1b2740;
    --panel: #1c2436;
    --border: #333d56;
    --border-soft: #2a3348;
    --text: #eef0f4;
    --dim: #96a0b0;
    --accent: #5f8ce8;
    --accent-dim: #3a5aa8;
    --input-bg: #202a40;
    --danger: #e8746f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-glow) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* --- Mascotte : élément de marque, animée --- */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .mascot-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 64px;
    height: 64px;
  }
  .brand h1 {
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.2px;
    font-weight: 700;
  }
  .brand p {
    margin: 0;
    font-size: 12.5px;
    color: var(--dim);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 4px;
  }
  .tabs button {
    flex: 1;
    background: transparent;
    color: var(--dim);
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .tabs button.active { background: var(--accent); color: #0b0e16; }

  form { display: flex; flex-direction: column; gap: 10px; }

  .field {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field svg {
    position: absolute;
    left: 14px;
    width: 17px;
    height: 17px;
    color: var(--dim);
    pointer-events: none;
  }
  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    color: var(--text);
    padding: 13px 14px 13px 40px;
    font-family: inherit;
    font-size: 16px;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: var(--dim); }
  input:focus { outline: none; border-color: var(--accent); }

  .primary-btn {
    background: var(--accent);
    color: #0b0e16;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-top: 4px;
    position: relative;
    overflow: hidden;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { opacity: 0.5; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    transform: scale(0);
    animation: ripple-anim 0.55s ease-out;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(2.6); opacity: 0; }
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }

  .oauth-list { display: flex; flex-direction: column; gap: 8px; }
  .oauth-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    color: var(--text);
    border-radius: 14px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .oauth-btn:active { transform: scale(0.98); background: var(--input-bg); }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .msg { font-size: 12.5px; text-align: center; min-height: 16px; line-height: 1.4; padding: 0 4px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--accent); }
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <canvas class="mascot-canvas" id="mascot" width="16" height="16"></canvas>
      <h1>kiritoAI</h1>
      <p>Connecte-toi pour commencer à discuter</p>
    </div>

    <div class="tabs">
      <button id="tab-signin" class="active" type="button">Connexion</button>
      <button id="tab-signup" type="button">Créer un compte</button>
    </div>

    <form id="auth-form">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z" opacity="0"></path>
          <path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6Z"></path>
          <path d="m2 7 10 6 10-6"></path>
        </svg>
        <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required minlength="6">
      </div>
      <button class="primary-btn" id="submit-btn" type="submit">Se connecter</button>
    </form>

    <p class="msg" id="msg"></p>

    <div class="divider">ou</div>

    <div class="oauth-list">
      <button class="oauth-btn" data-provider="google" type="button">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.28-1.68 3.76-5.5 3.76-3.3 0-6-2.73-6-6.1s2.7-6.1 6-6.1c1.88 0 3.14.8 3.86 1.49l2.63-2.53C16.9 3 14.66 2 12 2 6.9 2 2.8 6.14 2.8 11.24S6.9 20.5 12 20.5c6.6 0 8.72-4.6 8.72-6.98 0-.47-.05-.83-.11-1.19L12 10.2z"/></svg>
        Continuer avec Google
      </button>
      <button class="oauth-btn" data-provider="discord" type="button">
        <svg viewBox="0 0 24 24"><path fill="#5865F2" d="M20.3 5.4a17 17 0 0 0-4.3-1.3l-.2.4a15 15 0 0 1 3.8 1.4c-1.6-.8-3.2-1.3-4.9-1.5a12 12 0 0 0-5.4 0c-1.7.2-3.3.7-4.9 1.5a15 15 0 0 1 3.8-1.4l-.2-.4A17 17 0 0 0 3.7 5.4C1.5 8.7.9 12 1.2 15.1a17 17 0 0 0 5.1 2.6l.6-1c-.7-.3-1.4-.6-2-1 .2-.1.4-.3.5-.4a12 12 0 0 0 10.2 0l.5.4c-.6.4-1.3.7-2 1l.6 1a17 17 0 0 0 5.1-2.6c.4-3.6-.4-6.9-1.5-9.7ZM9 13.6c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm5.9 0c-.8 0-1.5-.8-1.5-1.7s.7-1.7 1.5-1.7 1.5.8 1.5 1.7-.7 1.7-1.5 1.7Z"/></svg>
        Continuer avec Discord
      </button>
      <button class="oauth-btn" data-provider="github" type="button">
        <svg viewBox="0 0 24 24"><path fill="#e6e8eb" d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 22 12c0-5.5-4.5-10-10-10Z"/></svg>
        Continuer avec GitHub
      </button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // ---------------------------------------------------------------
  // Mascotte kiritoAI — idle discret sur la page de connexion
  // ---------------------------------------------------------------
  (function () {
    const canvas = document.getElementById('mascot');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const _ = null;
    const B1 = '#4f7fe0', B2 = '#3a63c4', B3 = '#2a4a9e', W = '#e8f0ff', K = '#0d1220';

    const STAND = [
      [_,_,_,_,_,_,_,W,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,_,_,W,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,B1,B1,B1,B1,_,_,_,_,_,_,_],
      [_,_,_,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_,_],
      [_,_,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_],
      [_,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_],
      [_,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,_,_,_,_],
      [B2,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,B2,_,_,_],
      [B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_],
      [_,B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_,_],
      [_,B2,B2,B1,B1,B1,B1,B1,B1,B1,B2,B2,_,_,_,_],
      [_,_,B2,B2,B2,B2,B2,B2,B2,B2,B2,_,_,_,_,_],
      [_,_,B3,_,_,_,_,_,_,B3,_,_,_,_,_,_],
      [_,_,B3,_,_,_,_,_,_,B3,_,_,_,_,_,_],
      [_,B3,B3,_,_,_,_,_,_,B3,B3,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
    ];

    const EYES = [[3,6,7],[9,6,7]];

    function draw(blinking) {
      ctx.clearRect(0, 0, 16, 16);
      for (let y = 0; y < STAND.length; y++) {
        for (let x = 0; x < STAND[y].length; x++) {
          const c = STAND[y][x];
          if (c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
        }
      }
      if (blinking) {
        EYES.forEach(([x, yTop, yBottom]) => {
          ctx.fillStyle = B1; ctx.fillRect(x, yTop, 1, 1);
          ctx.fillStyle = B3; ctx.fillRect(x, yBottom, 1, 1);
        });
      }
    }

    let blinking = false;
    let nextBlink = 1200 + Math.random() * 1800;
    let blinkTimer = 0;

    function animate(time) {
      if (!blinking && time > nextBlink) { blinking = true; blinkTimer = time; }
      if (blinking && time - blinkTimer > 120) {
        blinking = false;
        nextBlink = time + 1800 + Math.random() * 2500;
      }
      draw(blinking);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  })();

  // ---------------------------------------------------------------
  // Effet "ripple" au clic, sur tous les boutons de la page
  // ---------------------------------------------------------------
  function attachRipple(btn) {
    btn.addEventListener('pointerdown', (e) => {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  }
  document.querySelectorAll('.primary-btn, .oauth-btn, .tabs button').forEach(attachRipple);

  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const submitBtn = document.getElementById('submit-btn');
  const authForm = document.getElementById('auth-form');
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const msgEl = document.getElementById('msg');

  let mode = 'signin'; // 'signin' | 'signup'

  // Si déjà connecté, direct vers le chat.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'index.html';
  });

  function setMode(newMode) {
    mode = newMode;
    tabSignin.classList.toggle('active', mode === 'signin');
    tabSignup.classList.toggle('active', mode === 'signup');
    submitBtn.textContent = mode === 'signin' ? 'Se connecter' : 'Créer mon compte';
    passwordEl.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
    msgEl.textContent = '';
    msgEl.className = 'msg';
  }

  tabSignin.addEventListener('click', () => setMode('signin'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = `msg ${type}`;
  }

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    submitBtn.disabled = true;
    showMsg('', '');

    try {
      if (mode === 'signup') {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        showMsg('Compte créé. Vérifie tes emails si une confirmation est requise, sinon tu es connecté(e).', 'success');
        // Si la confirmation email est désactivée, une session existe déjà :
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) window.location.href = 'index.html';
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'index.html';
      }
    } catch (err) {
      showMsg(err.message || 'Une erreur est survenue.', 'error');
    }

    submitBtn.disabled = false;
  });

  document.querySelectorAll('.oauth-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const provider = btn.dataset.provider;
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider,
        options: { redirectTo: window.location.origin + '/index.html' },
      });
      if (error) showMsg(error.message, 'error');
    });
  });
</script>
</body>
</html>
