<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --border: #262b33;
    --text: #e6e8eb;
    --dim: #7d8590;
    --accent: #5fd3a3;
    --user-bubble: #1e2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; font-weight: 600; }
  header .model { color: var(--dim); font-size: 12px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .role { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--border); }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.assistant .bubble.loading { color: var(--dim); }

  form {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    height: 44px;
    max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0d0f12;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>chat</h1>
    <span class="model">connecté à ton API</span>
  </header>

  <div id="chat"></div>

  <form id="form">
    <textarea id="input" placeholder="Écris un message..." rows="1"></textarea>
    <button id="send" type="submit">Envoyer</button>
  </form>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `<span class="role">${role === 'user' ? 'toi' : 'ia'}</span><div class="bubble">${escapeHtml(content)}</div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap.querySelector('.bubble');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const loadingBubble = addMessage('assistant', '...');
    loadingBubble.classList.add('loading');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingBubble.textContent = `Erreur : ${data.error || 'inconnue'}`;
        loadingBubble.classList.remove('loading');
        sendBtn.disabled = false;
        return;
      }

      loadingBubble.textContent = data.reply;
      loadingBubble.classList.remove('loading');
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      loadingBubble.textContent = 'Erreur réseau. Réessaie.';
      loadingBubble.classList.remove('loading');
    }

    sendBtn.disabled = false;
    input.focus();
  });

  input.focus();
</script>
</body>
</html>
