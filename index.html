<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131a28">
<title>Chat IA</title>
<style>
  :root {
    --bg: #131a28;
    --panel: #1c2436;
    --border: #333d56;
    --text: #eef0f4;
    --dim: #96a0b0;
    --accent: #5f8ce8;
    --user-bubble: #26314a;
    --input-bg: #202a40;
    --vh: 100dvh;
    --glass-bg: rgba(32, 42, 64, 0.5);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --glass-blur: blur(20px) saturate(180%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: var(--vh);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; font-weight: 600; }
  header .model { color: var(--dim); font-size: 11px; }
  header .spacer { flex: 1; }
  header .user-email { color: var(--dim); font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    position: relative;
    overflow: hidden;
  }
  header .logout-btn:active { transform: scale(0.96); }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    transform: scale(0);
    animation: ripple-anim 0.55s ease-out;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(2.6); opacity: 0; }
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .role { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; padding: 0 2px; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 15px;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .thinking-status {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .thinking-label {
    font-size: 12px;
    color: var(--dim);
    opacity: 0.65;
    padding: 0 2px;
    animation: thinking-fade 1.6s ease-in-out infinite;
  }
  @keyframes thinking-fade {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.85; }
  }
  .mascot-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 40px;
    height: 40px;
    display: block;
  }

  form {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    flex-shrink: 0;
  }
  .input-pill {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    padding: 14px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 6px 24px rgba(0,0,0,0.25);
  }
  textarea {
    width: 100%;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 0 6px;
    font-family: inherit;
    /* 16px minimum empêche Safari iOS de zoomer automatiquement au focus */
    font-size: 16px;
    line-height: 1.3;
    height: 24px;
    max-height: 140px;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--dim); }
  .pill-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pill-row .spacer { flex: 1; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    position: relative;
    overflow: hidden;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 17px; height: 17px; }
  button#send svg { width: 18px; height: 18px; }
  button#send {
    background: var(--accent);
    color: #0b0e16;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  button#send:active { transform: scale(0.94); }
  button#send:disabled { opacity: 0.4; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>chat</h1>
    <span class="model">connecté à ton API</span>
    <span class="spacer"></span>
    <span class="user-email" id="user-email"></span>
    <button class="logout-btn" id="logout-btn" type="button">Déconnexion</button>
  </header>

  <div id="chat"></div>

  <form id="form">
    <div class="input-pill">
      <textarea id="input" placeholder="Écris un message..." rows="1" enterkeyhint="send"></textarea>
      <div class="pill-row">
        <button class="icon-btn" type="button" aria-label="Ajouter">+</button>
        <span class="spacer"></span>
        <button id="send" type="submit" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="6 11 12 5 18 11"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const userEmailEl = document.getElementById('user-email');
  const logoutBtn = document.getElementById('logout-btn');

  let history = [];
  let accessToken = null;

  // ---------------------------------------------------------------
  // Effet "ripple" au clic, sur les boutons de l'interface
  // ---------------------------------------------------------------
  function attachRipple(btn) {
    btn.addEventListener('pointerdown', (e) => {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  }
  document.querySelectorAll('.icon-btn, #send, .logout-btn').forEach(attachRipple);

  // ---------------------------------------------------------------
  // Mascotte kiritoAI — animation "réflexion" (bulle de chargement)
  // ---------------------------------------------------------------
  const MASCOT = (() => {
    const _ = null;
    const B1 = '#4f7fe0';
    const B2 = '#3a63c4';
    const B3 = '#2a4a9e';
    const W  = '#e8f0ff';
    const K  = '#0d1220';

    const STAND = [
      [_,_,_,_,_,_,_,W,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,_,_,W,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,B1,B1,B1,B1,_,_,_,_,_,_,_],
      [_,_,_,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_,_],
      [_,_,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_],
      [_,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_],
      [_,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,_,_,_,_],
      [B2,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,B2,_,_,_],
      [B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_],
      [_,B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_,_],
      [_,B2,B2,B1,B1,B1,B1,B1,B1,B1,B2,B2,_,_,_,_],
      [_,_,B2,B2,B2,B2,B2,B2,B2,B2,B2,_,_,_,_,_],
      [_,_,B3,_,_,_,_,_,_,B3,_,_,_,_,_,_],
      [_,_,B3,_,_,_,_,_,_,B3,_,_,_,_,_,_],
      [_,B3,B3,_,_,_,_,_,_,B3,B3,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
    ];

    const CROUCH = [
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,B1,B1,B1,B1,_,_,_,_,_,_,_],
      [_,_,_,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_,_],
      [_,_,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_,_],
      [_,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,_,_,_,_],
      [_,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,_,_,_,_],
      [B2,B1,B1,K,B1,B1,B1,B1,B1,K,B1,B1,B2,_,_,_],
      [B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_],
      [_,B2,B1,B1,B1,B1,B1,B1,B1,B1,B1,B2,_,_,_,_],
      [_,B2,B2,B1,B1,B1,B1,B1,B1,B1,B2,B2,_,_,_,_],
      [_,_,B2,B2,B2,B2,B2,B2,B2,B2,B2,_,_,_,_,_],
      [_,B3,B3,_,_,_,_,_,_,B3,B3,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
      [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
    ];

    const EYES = {
      stand:  [[3,6,7],[9,6,7]],
      crouch: [[3,7,8],[9,7,8]],
    };

    function draw(ctx, grid, eyeCoords, blinking) {
      ctx.clearRect(0, 0, 16, 16);
      for (let y = 0; y < grid.length; y++) {
        for (let x = 0; x < grid[y].length; x++) {
          const color = grid[y][x];
          if (color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); }
        }
      }
      if (blinking) {
        eyeCoords.forEach(([x, yTop, yBottom]) => {
          ctx.fillStyle = B1;
          ctx.fillRect(x, yTop, 1, 1);
          ctx.fillStyle = B3;
          ctx.fillRect(x, yBottom, 1, 1);
        });
      }
    }

    // Crée un canvas animé et retourne une fonction stop() pour l'arrêter proprement.
    function mount(container) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      canvas.className = 'mascot-canvas';
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      container.appendChild(canvas);

      let squatting = false;
      let lastSquat = 0;
      let blinking = false;
      let nextBlink = 400 + Math.random() * 500;   // clignements rapprochés = "réflexion"
      let blinkTimer = 0;
      let rafId = null;
      let stopped = false;

      function animate(time) {
        if (stopped) return;
        const holdTime = squatting ? 300 : 380; // cycle rapide = agité/pensif
        if (time - lastSquat > holdTime) {
          squatting = !squatting;
          lastSquat = time;
        }
        if (!blinking && time > nextBlink) {
          blinking = true;
          blinkTimer = time;
        }
        if (blinking && time - blinkTimer > 120) {
          blinking = false;
          nextBlink = time + 500 + Math.random() * 700;
        }
        if (squatting) {
          draw(ctx, CROUCH, EYES.crouch, blinking);
        } else {
          draw(ctx, STAND, EYES.stand, blinking);
        }
        rafId = requestAnimationFrame(animate);
      }
      rafId = requestAnimationFrame(animate);

      return function stop() {
        stopped = true;
        if (rafId) cancelAnimationFrame(rafId);
        canvas.remove();
      };
    }

    return { mount };
  })();

  // --- Garde d'authentification : redirige vers login.html si pas connecté ---
  (async function checkAuth() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'login.html';
      return;
    }
    accessToken = data.session.access_token;
    userEmailEl.textContent = data.session.user.email || '';
  })();

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (!session) {
      window.location.href = 'login.html';
    } else {
      accessToken = session.access_token;
      userEmailEl.textContent = session.user.email || '';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  // Corrige la hauteur réelle de la fenêtre sur mobile (barre d'adresse qui
  // apparaît/disparaît, clavier virtuel) en utilisant l'API visualViewport.
  function setViewportHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }
  setViewportHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setViewportHeight);
    window.visualViewport.addEventListener('scroll', setViewportHeight);
  }
  window.addEventListener('orientationchange', () => setTimeout(setViewportHeight, 100));

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `<span class="role">${role === 'user' ? 'toi' : 'ia'}</span><div class="bubble">${escapeHtml(content)}</div>`;
    chatEl.appendChild(wrap);
    scrollToBottom();
    return wrap.querySelector('.bubble');
  }

  // Statut "en train de réfléchir" : pas de bulle, juste un texte discret + la mascotte.
  function addThinkingStatus(label) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML = `<span class="role">ia</span><div class="thinking-status"><span class="thinking-label">${escapeHtml(label)}</span></div>`;
    chatEl.appendChild(wrap);
    scrollToBottom();
    const statusEl = wrap.querySelector('.thinking-status');
    const stopMascot = MASCOT.mount(statusEl);
    return { wrap, statusEl, stopMascot };
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('focus', () => {
    // Laisse le clavier finir son animation avant de recadrer
    setTimeout(scrollToBottom, 300);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const { wrap: thinkingWrap, stopMascot } = addThinkingStatus('Réflexion en cours...');
    scrollToBottom();

    // Remplace le statut "réflexion" par une vraie bulle de réponse
    function replaceWithBubble(content) {
      stopMascot();
      thinkingWrap.innerHTML = `<span class="role">ia</span><div class="bubble">${escapeHtml(content)}</div>`;
      scrollToBottom();
    }

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      if (!res.ok) {
        replaceWithBubble(`Erreur : ${data.error || 'inconnue'}`);
        sendBtn.disabled = false;
        return;
      }

      replaceWithBubble(data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      replaceWithBubble('Erreur réseau. Réessaie.');
    }

    sendBtn.disabled = false;
  });
</script>
</body>
</html>
