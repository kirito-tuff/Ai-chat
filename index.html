<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Chat IA</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --border: #262b33;
    --text: #e6e8eb;
    --dim: #7d8590;
    --accent: #5fd3a3;
    --user-bubble: #1e2530;
    --vh: 100dvh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    height: var(--vh);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.5px; font-weight: 600; }
  header .model { color: var(--dim); font-size: 11px; }
  header .spacer { flex: 1; }
  header .user-email { color: var(--dim); font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
  }
  header .logout-btn:active { transform: scale(0.96); }

  #chat {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .role { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; padding: 0 2px; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 15px;
  }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.assistant .bubble.loading { color: var(--dim); }

  form {
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    flex-shrink: 0;
    background: var(--bg);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    padding: 12px 16px;
    font-family: inherit;
    /* 16px minimum empêche Safari iOS de zoomer automatiquement au focus */
    font-size: 16px;
    line-height: 1.3;
    height: 46px;
    max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0d0f12;
    border: none;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    font-weight: 600;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:active { transform: scale(0.94); }
  button:disabled { opacity: 0.4; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>chat</h1>
    <span class="model">connecté à ton API</span>
    <span class="spacer"></span>
    <span class="user-email" id="user-email"></span>
    <button class="logout-btn" id="logout-btn" type="button">Déconnexion</button>
  </header>

  <div id="chat"></div>

  <form id="form">
    <textarea id="input" placeholder="Écris un message..." rows="1" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Envoyer">➤</button>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const userEmailEl = document.getElementById('user-email');
  const logoutBtn = document.getElementById('logout-btn');

  let history = [];
  let accessToken = null;

  // --- Garde d'authentification : redirige vers login.html si pas connecté ---
  (async function checkAuth() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'login.html';
      return;
    }
    accessToken = data.session.access_token;
    userEmailEl.textContent = data.session.user.email || '';
  })();

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (!session) {
      window.location.href = 'login.html';
    } else {
      accessToken = session.access_token;
      userEmailEl.textContent = session.user.email || '';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  // Corrige la hauteur réelle de la fenêtre sur mobile (barre d'adresse qui
  // apparaît/disparaît, clavier virtuel) en utilisant l'API visualViewport.
  function setViewportHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }
  setViewportHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setViewportHeight);
    window.visualViewport.addEventListener('scroll', setViewportHeight);
  }
  window.addEventListener('orientationchange', () => setTimeout(setViewportHeight, 100));

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `<span class="role">${role === 'user' ? 'toi' : 'ia'}</span><div class="bubble">${escapeHtml(content)}</div>`;
    chatEl.appendChild(wrap);
    scrollToBottom();
    return wrap.querySelector('.bubble');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('focus', () => {
    // Laisse le clavier finir son animation avant de recadrer
    setTimeout(scrollToBottom, 300);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const loadingBubble = addMessage('assistant', '...');
    loadingBubble.classList.add('loading');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingBubble.textContent = `Erreur : ${data.error || 'inconnue'}`;
        loadingBubble.classList.remove('loading');
        sendBtn.disabled = false;
        return;
      }

      loadingBubble.textContent = data.reply;
      loadingBubble.classList.remove('loading');
      history.push({ role: 'assistant', content: data.reply });
      scrollToBottom();
    } catch (err) {
      loadingBubble.textContent = 'Erreur réseau. Réessaie.';
      loadingBubble.classList.remove('loading');
    }

    sendBtn.disabled = false;
  });
</script>
</body>
</html>
